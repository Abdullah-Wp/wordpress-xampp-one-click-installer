name: Python syntax check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax-check:
    name: Compile app.py
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python source
        run: python -m py_compile app.py
